name: tenantpool ci

# Unit gate for the tenantpool library. This is a pure Go library (no
# binary, no Dockerfile, no deploy) consumed by analytics/messaging — the
# only pipeline it needs is build + vet + the unit suite on every push to
# main and every PR. There are no `//go:build integration` files and no
# testcontainers usage, so there is intentionally no integration job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit + vet + build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Keep the CI toolchain explicit and aligned with go.mod.
          go-version: '1.26.5'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.2.0
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -short -race -count=1 ./...

      # Keep lint fail-closed and reproducible. v2.12.2 supports Go 1.26.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
